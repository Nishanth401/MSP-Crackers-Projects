server:
  port: 8080
  servlet:
    context-path: /api

spring:
  application:
    name: msp-pyro-park-backend
  profiles:
    active: dev

  datasource:
    url: jdbc:h2:mem:msppyroparkdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL
    driver-class-name: org.h2.Driver
    username: sa
    password: ""

  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: false

  flyway:
    enabled: false # Enabled for MySQL production profile

---
spring:
  config:
    activate:
      on-profile: prod

  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:msppyropark}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Kolkata
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: ${DB_USER:root}
    password: ${DB_PASSWORD:secret}

  jpa:
    database-platform: org.hibernate.dialect.MySQLDialect
    hibernate:
      ddl-auto: validate
    show-sql: false

  flyway:
    enabled: true
    locations: classpath:db/migration,filesystem:database/migrations

---
app:
  admin:
    api-key: ${ADMIN_API_KEY:msp2026-admin-secret-key-sivakasi}
  cors:
    allowed-origins:
      - "http://localhost:5173"
      - "http://127.0.0.1:5173"
      - "http://localhost:3000"
  compliance:
    minimum-age: 18
    state: "Tamil Nadu"
    allow-online-card-charging: false # Set true only after statutory gateway clearance
